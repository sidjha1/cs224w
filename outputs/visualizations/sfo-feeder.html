    #sfo-feeder-explorer .selected-caption { display:grid; gap:calc(var(--font-size-base)*.4); }

  (() => {
    const root=document.getElementById('sfo-feeder-explorer');

    let selected='p1ulv7633',mode='role';
    const escape=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
    function restore(state){
      const saved=state?.modelContent;
      if(saved && byId.has(saved.bus))selected=saved.bus;
      if(saved && ['role','voltage','capacity'].includes(saved.colorBy))mode=saved.colorBy;
    }
    restore(window.openai?.widgetState);
    function persist(){window.openai?.setWidgetState?.({modelContent:{feeder:data.feeder,bus:selected,colorBy:mode},privateContent:null})?.catch(()=>{});}

      const attrs=`class="${cls}" fill="${color(n)}" data-node="${n.name}" data-tooltip="${escape(optionName(n))}"`;
      if(n.role==='root')return `<polygon ${attrs} points="${x},${y-r-2} ${x+r+2},${y} ${x},${y+r+2} ${x-r-2},${y}"/>`;
      if(n.role==='transformer terminal')return `<rect ${attrs} x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}"/>`;
      return `<circle ${attrs} cx="${x}" cy="${y}" r="${r}"/>`;
    }
    function legend(){
      const items=mode==='role'?[['root-mark','Feeder head · 1'],['load-mark','Customer · 26'],['terminal-mark','Transformer terminal · 40'],['junction-mark','Other junction · 17']]:[];
      if(mode==='role')q('sfo-legend').innerHTML=items.map(([cls,label])=>`<span><i class="mark ${cls}" aria-hidden="true"></i>${label}</span>`).join('');
      else if(mode==='voltage')q('sfo-legend').innerHTML=[['1','Primary · 12.47 kV line-to-line'],['2','Three-phase service · 480 V line-to-line'],['3','Split-phase service · 120 V per leg']].map(([s,label])=>`<span><i class="mark" style="background:var(--viz-series-${s})" aria-hidden="true"></i>${label}</span>`).join('');
      else q('sfo-legend').innerHTML='<span>Customer HC: pale = lower, strong = higher · 14.06–388.75 kW</span><span>Other buses: unlabeled</span>';
    }
    function draw(){
      q('sfo-mode').value=mode;q('sfo-node').value=selected;legend();
      const w=Math.max(280,root.getBoundingClientRect().width),h=480,margin=18;
      const leafNames=[];
      const ys=new Map();
      function place(id){
        const cs=children.get(id);
        if(!cs.length){const y=38+leafNames.length*16.4;leafNames.push(id);ys.set(id,y);return y;}
        const pos=cs.map(place);const y=(Math.min(...pos)+Math.max(...pos))/2;ys.set(id,y);return y;
      }
      place(source.name);
      const xy=n=>[margin+n.depth*(w-2*margin)/data.maxDepth,ys.get(n.name)];
      const path=new Set();let cursor=selected;
      while(cursor){path.add(cursor);cursor=byId.get(cursor).parent;}
      let drawing=`<title>SFO feeder topology</title><desc>84 buses; selected path ends at ${selected}. Squares are transformer terminals, circles are customers or other junctions, and the diamond is the feeder head.</desc>`;
      drawing+=`<text class="text-small" x="0" y="14">Feeder head</text><text class="text-small" text-anchor="end" x="${w}" y="14">Branches → customers</text>`;
      data.edges.forEach(e=>{
        const [x1,y1]=xy(byId.get(e.parent)),[x2,y2]=xy(byId.get(e.child));
        drawing+=`<path class="${path.has(e.child)?'route-edge':'edge'}" d="M${x1},${y1} H${(x1+x2)/2} V${y2} H${x2}"/>`;
        const x=(x1+x2)/2+((x2-x1)/4),y=y2;
        if(e.kind==='transformer')drawing+=`<rect x="${x-3}" y="${y-3}" width="6" height="6" fill="var(--viz-series-3)" data-tooltip="${escape(e.name)} · transformer"/>`;
        if(e.kind==='switch')drawing+=`<polygon points="${x},${y-4} ${x+4},${y} ${x},${y+4} ${x-4},${y}" fill="var(--viz-series-4)" data-tooltip="Switch"/>`;
      });
      data.nodes.forEach(n=>{const [x,y]=xy(n);drawing+=nodeShape(n,x,y,n.role==='customer'?5:3.5,'cursor-interaction');});
      q('sfo-tree').setAttribute('viewBox',`0 0 ${w} ${h}`);
      q('sfo-tree').style.height=h+'px';q('sfo-tree').innerHTML=drawing;
      const node=byId.get(selected),v=node.kv*1000;
      q('sfo-selected-name').textContent=node.name+' · '+node.role;
      const service=node.kv>1?'primary distribution':node.kv>.2?'480 V three-phase service':'120 V service legs';
      q('sfo-selected-detail').textContent=`${service} · ${v.toFixed(0)} V nominal to neutral · local demand ${node.kw.toFixed(2)} kW · baseline ${node.vmin.toFixed(3)}–${node.vmax.toFixed(3)} p.u.`+(node.hc!==null?` · HC ${node.hc.toFixed(2)} kW`:' · HC not labeled');
      const route=[];cursor=selected;
      while(byId.get(cursor).parent){route.unshift(childEdges.get(cursor));cursor=byId.get(cursor).parent;}
      const transformer=[...route].reverse().find(e=>e.kind==='transformer');
      q('sfo-customer-route').hidden=!transformer || node.role!=='customer';
      if(transformer && node.role==='customer'){
        const landmarks=[source,byId.get(transformer.parent),byId.get(transformer.child),node];
        const xs=[w*.08,w*.36,w*.64,w*.92],y=49;
        const transformerX=(xs[1]+xs[2])/2;
        let routeSvg='<title>Source to customer, simplified</title><desc>Intermediate junctions collapsed; the center edge is a real transformer. Voltage levels change across this edge.</desc>';
        routeSvg+=`<line x1="${xs[0]}" y1="${y}" x2="${xs[3]}" y2="${y}" stroke="var(--muted-foreground)" stroke-width="1.5"/>`;
        routeSvg+=`<rect x="${transformerX-7}" y="${y-7}" width="14" height="14" fill="var(--viz-series-3)"/>`;
        routeSvg+=`<text class="text-small" text-anchor="middle" x="${transformerX}" y="20">Transformer</text>`;
        landmarks.forEach((n,i)=>{routeSvg+=nodeShape(n,xs[i],y,6);});
        q('sfo-route').setAttribute('viewBox',`0 0 ${w} 76`);q('sfo-route').style.height='76px';q('sfo-route').innerHTML=routeSvg;
        q('sfo-route-labels').innerHTML=landmarks.map((n,i)=>`<div>${['Feeder head','Primary terminal','Secondary terminal','Customer bus'][i]}<br><span class="tabular-nums">${n.kv>1?(n.kv*Math.sqrt(3)).toFixed(2)+' kV LL':n.kv>.2?(n.kv*1000*Math.sqrt(3)).toFixed(0)+' V LL':(n.kv*1000).toFixed(0)+' V / leg'}</span></div>`).join('');
        const result=data.limits[selected];
        q('sfo-limit').textContent=`${transformer.normal_kva.toFixed(1)} kVA normal transformer rating · HC bracket ${node.hc.toFixed(2)}–${result.upper.toFixed(2)} kW · first upper-bound violation: ${result.kind==='voltage'?'voltage above 1.05 p.u.':'equipment current limit'} · intermediate wire junctions collapsed`;
      }
    }
    q('sfo-node').addEventListener('change',e=>{selected=e.target.value;draw();persist();});
    q('sfo-mode').addEventListener('change',e=>{mode=e.target.value;draw();persist();});
    q('sfo-tree').addEventListener('click',e=>{const name=e.target.dataset.node;if(byId.has(name)){selected=name;draw();persist();}});
    window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);draw();});
    new ResizeObserver(draw).observe(root);draw();
  })();
  </script>
</div>
